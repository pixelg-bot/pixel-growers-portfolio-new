<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f5f6f8"/><rect width="1200" height="90" fill="#202228"/><g font-family="Arial,sans-serif"><text x="42" y="39" font-size="15" font-weight="700" fill="#dba9ef">PIXEL GROWERS / CAMPAIGN REPORT</text><text x="42" y="69" font-size="15" fill="#ddd">Meta Ads · 1–30 Jan 2023</text><text x="42" y="145" font-size="32" font-weight="700" fill="#16171b">Food-truck enquiries</text><text x="42" y="177" font-size="14" fill="#62666e">Recreated summary from supplied campaign data — not an original platform screenshot</text><rect x="42" y="211" width="1116" height="45" rx="5" fill="#8036a6"/><text x="66" y="240" font-size="16" font-weight="700" fill="white">REPORTED MEASURE</text><text x="800" y="240" font-size="16" font-weight="700" fill="white">RECORDED VALUE</text><rect x="42" y="256" width="1116" height="70" fill="#ffffff"/><text x="66" y="299" font-size="18" fill="#33373f">Facebook form submissions</text><text x="800" y="299" font-size="27" font-weight="700" fill="#19734e">527</text><rect x="42" y="326" width="1116" height="70" fill="#eceef2"/><text x="66" y="369" font-size="18" fill="#33373f">Average cost per lead</text><text x="800" y="369" font-size="27" font-weight="700" fill="#19734e">$2.71</text><rect x="42" y="396" width="1116" height="70" fill="#ffffff"/><text x="66" y="439" font-size="18" fill="#33373f">Ad cost for two campaigns</text><text x="800" y="439" font-size="27" font-weight="700" fill="#19734e">$1,430</text><text x="42" y="515" font-size="14" fill="#595f69">Jan 1-30, 2023. 527 forms are not confirmed orders. The blended cost uses $1,429.62 of spend; dollar currency is unspecified.</text></g></svg>